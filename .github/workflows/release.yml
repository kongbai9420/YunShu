name: Release

# 推送 v*.*.* 标签时的完整发布流水线（只生成草稿发布，由维护者检查后手动发布）。
#
#   version ─┬─ ci（ci-4.0.yml：后端 SQLite / PG 16 / 17、前端、Windows 桌面、compose 校验）
#            ├─ image-gate（ops-image.yml：双架构构建、冒烟、SBOM 与漏洞门禁）
#            ├─ linux（linux-package.yml：linux-amd64 / linux-arm64 tarball）
#            └─ windows（windows-package.yml：windows-msi / windows-zip）
#   上面全部通过 → publish-image（推送多架构镜像、cosign 签名、构建来源证明）
#                → image-archive（每个架构按摘要拉取、docker save 离线包、SBOM 绑定最终摘要、再过一次门禁）
#                → checksums（汇总全部发布文件、SHA256SUMS、cosign sign-blob、文件来源证明）
#                → release（创建草稿 GitHub Release 并上传全部文件）
#
# 镜像只在这里推送（ops-image.yml 不再响应标签），签名证书里的身份因此固定为
# https://github.com/<仓库>/.github/workflows/release.yml@refs/tags/v…，见 deploy/VERIFY.md。
# GHCR 包的可见性不能用 GITHUB_TOKEN 修改，首次发布后由维护者在包设置里手动改为公开。

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kongbai9420/yunshu

jobs:
  version:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout Repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Tag must match backend and frontend versions
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::标签 $TAG 不是 vX.Y.Z 或 vX.Y.Z-pre 格式"
            exit 1
          fi
          read -r backend frontend lock < <(python3 - <<'PY'
          import json, re
          src = open("backend/app/__init__.py", encoding="utf-8").read()
          m = re.search(r"^__version__\s*=\s*[\"']([^\"']+)[\"']", src, re.M)
          pkg = json.load(open("frontend/package.json", encoding="utf-8"))
          lock = json.load(open("frontend/package-lock.json", encoding="utf-8"))
          print(m.group(1) if m else "-", pkg.get("version", "-"), lock.get("version", "-"))
          PY
          )
          lock="${lock%$'\r'}"
          echo "tag=$TAG backend=$backend frontend=$frontend package-lock=$lock"
          for v in "$backend" "$frontend" "$lock"; do
            if [[ "v$v" != "$TAG" ]]; then
              echo "::error::标签 $TAG 与源码版本不一致（backend $backend、frontend $frontend、package-lock $lock）"
              exit 1
            fi
          done
          # 只发布已经合并到 main 的提交
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::标签指向的提交不在 main 上"
            exit 1
          }
          # 发布说明随代码评审，缺失时在推送任何镜像之前就失败
          notes=".github/release-notes/$TAG.md"
          if [[ ! -s "$notes" ]]; then
            echo "::error::缺少发布说明 $notes"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: Test gates
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci-4.0.yml

  image-gate:
    name: Image smoke and evidence gate
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ops-image.yml

  linux:
    name: Linux packages
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/linux-package.yml

  windows:
    name: Windows packages
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/windows-package.yml

  publish-image:
    name: Publish and sign image
    # 全部测试、镜像门禁与安装包都通过后才推送，避免只推了镜像而发布不完整
    needs: [version, ci, image-gate, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout Repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up QEMU
        # v3.7.0
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        # v3.12.0
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Image tags
        id: meta
        # v5.10.0
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        env:
          # 多架构索引上也写 OCI 注解，GHCR 据此关联仓库与说明
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # 不可变版本号（如 4.4.0-beta.1）+ 滚动别名；latest 只给正式版
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=alpha,enable=${{ contains(github.ref_name, '-alpha.') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=rc,enable=${{ contains(github.ref_name, '-rc.') }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      - name: Log in to GHCR
        # v3.7.0
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: push
        # v5.4.0
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: ./docker/Dockerfile.ops
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # 来源证明与 SBOM 用 GitHub attestation 绑定到最终摘要；不在索引里放 buildx 自带的
          # attestation 清单（GHCR 会显示成 unknown/unknown 平台）
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=ops-image-amd64
            type=gha,scope=ops-image-arm64

      - name: Check pushed index
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::没有拿到镜像摘要：$DIGEST"; exit 1; }
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          platforms="$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')"
          test "$platforms" = "linux/amd64,linux/arm64"
          {
            echo "### Image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        # v4.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v3.0.6'

      - name: Sign image digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Build provenance attestation for the image
        # v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # 存储记录只对组织仓库可用，个人仓库关掉
          create-storage-record: false

  image-archive:
    name: Offline image (${{ matrix.arch }})
    needs: [version, publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # 拉取镜像，并把 SBOM 证明推到镜像仓库
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      INDEX_DIGEST: ${{ needs.publish-image.outputs.digest }}
      ARCH: ${{ matrix.arch }}
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      - name: Checkout Repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to GHCR
        # v3.7.0
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull by digest and save
        id: save
        run: |
          set -euo pipefail
          # 先从多架构索引里取出本架构的清单摘要，再按这个摘要拉取：本地只有这一个平台，
          # 不受 Docker 镜像存储类型（经典 / containerd）影响
          platform_digest="$(docker buildx imagetools inspect --raw "$IMAGE@$INDEX_DIGEST" \
            | jq -r --arg a "$ARCH" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest')"
          [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::索引里没有 linux/$ARCH"; exit 1; }
          docker pull --platform "linux/$ARCH" "$IMAGE@$platform_digest"
          docker tag "$IMAGE@$platform_digest" "$IMAGE:$VERSION"
          test "$(docker image inspect -f '{{.Architecture}}' "$IMAGE:$VERSION")" = "$ARCH"
          mkdir -p out
          archive="out/yunshu-$VERSION-image-$ARCH.tar.gz"
          docker save "$IMAGE:$VERSION" | gzip -n -9 > "$archive"
          gzip -t "$archive"
          ls -l "$archive"
          {
            echo "platform_digest=$platform_digest"
            echo "image_id=$(docker image inspect -f '{{.Id}}' "$IMAGE:$VERSION")"
          } >> "$GITHUB_OUTPUT"
          echo "linux/$ARCH: \`$IMAGE@$platform_digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Download pinned Syft
        id: syft
        # sbom-action v0.24.3；只下载工具
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          syft-version: v1.54.1

      - name: Download pinned Grype
        id: grype
        # scan-action v7.4.2
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          grype-version: v0.120.1
          cache-db: 'true'

      - name: SBOM and evidence gate for the published image
        env:
          IMAGE_ID: ${{ steps.save.outputs.image_id }}
        run: |
          set -euo pipefail
          ev="artifacts/supply-chain/release-image-$ARCH"
          mkdir -p "$ev"
          sbom="out/yunshu-$VERSION-image-$ARCH.spdx.json"
          "${{ steps.syft.outputs.cmd }}" "docker:$IMAGE:$VERSION" \
            --source-name "$IMAGE" --source-version "$VERSION" \
            -o "syft-json=$ev/sbom.syft.json" -o "spdx-json=$sbom"
          "${{ steps.grype.outputs.cmd }}" "sbom:$ev/sbom.syft.json" -o json --file "$ev/scan.grype.json"
          # 与 ops-image.yml 同一门禁，这次针对实际推送并将要发布的镜像
          python3 scripts/supply_chain_evidence.py --sbom "$sbom" --scan-input "$ev/sbom.syft.json" \
            --scan "$ev/scan.grype.json" --output "$ev" --scope image --image-id "$IMAGE_ID" --enforce

      - name: Archive evidence
        if: always()
        # v7.0.2；workflow artifact，非版本发布
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supply-chain-release-image-${{ matrix.arch }}
          path: artifacts/supply-chain/release-image-${{ matrix.arch }}/
          if-no-files-found: ignore
          retention-days: 30

      - name: SBOM attestation bound to the multi-arch index digest
        # actions/attest v4.2.1（attest-build-provenance v4.2.2 内部使用的同一提交；attest-sbom 已弃用）
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.INDEX_DIGEST }}
          sbom-path: out/yunshu-${{ env.VERSION }}-image-${{ matrix.arch }}.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: SBOM attestation bound to the platform manifest digest
        # actions/attest v4.2.1
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.save.outputs.platform_digest }}
          sbom-path: out/yunshu-${{ env.VERSION }}-image-${{ matrix.arch }}.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Upload offline image and SBOM
        # v7.0.2；workflow artifact，release 任务再上传到 GitHub Release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-image-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  checksums:
    name: Checksums and signatures
    needs: [version, linux, windows, image-archive]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      # 按名字逐个下载，每个 artifact 放进同名目录
      - name: Download linux-amd64
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-amd64
          path: staging/linux-amd64

      - name: Download linux-arm64
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-arm64
          path: staging/linux-arm64

      - name: Download windows-msi
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-msi
          path: staging/windows-msi

      - name: Download windows-zip
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-zip
          path: staging/windows-zip

      - name: Download release-image-amd64
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-image-amd64
          path: staging/release-image-amd64

      - name: Download release-image-arm64
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-image-arm64
          path: staging/release-image-arm64

      - name: Download pinned Syft
        id: syft
        # sbom-action v0.24.3；只下载工具
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          syft-version: v1.54.1

      - name: Collect release files and check their .sha256
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p dist
          find staging -type f | sort

          # 在某个 artifact 里找恰好一个匹配的文件
          one() {
            local dir="staging/$1" pattern="$2" found
            mapfile -t found < <(find "$dir" -type f -name "$pattern" | sort)
            if [[ ${#found[@]} -ne 1 ]]; then
              echo "::error::$1 里应有且只有一个 $pattern，实际 ${#found[@]} 个" >&2
              exit 1
            fi
            printf '%s\n' "${found[0]}"
          }
          # 打包任务给的 .sha256（可能来自 PowerShell，含 BOM 或大写）必须与实际文件一致
          check_sidecar() {
            local f="$1" expected actual
            expected="$(grep -oiE '[0-9a-f]{64}' "$f.sha256" | head -n1 | tr 'A-F' 'a-f')"
            actual="$(sha256sum "$f" | cut -d' ' -f1)"
            if [[ -z "$expected" || "$expected" != "$actual" ]]; then
              echo "::error::$(basename "$f") 的 .sha256 与实际不符（$expected / $actual）" >&2
              exit 1
            fi
          }
          # 先赋值再用：命令替换失败时 set -e 才会中止
          for arch in amd64 arm64; do
            f="$(one "linux-$arch" "yunshu-$VERSION-linux-$arch.tar.gz")"
            check_sidecar "$f"; cp -- "$f" dist/
            f="$(one "release-image-$arch" "yunshu-$VERSION-image-$arch.tar.gz")"
            cp -- "$f" dist/
            f="$(one "release-image-$arch" "yunshu-$VERSION-image-$arch.spdx.json")"
            cp -- "$f" dist/
          done
          f="$(one windows-msi "Yunshu-$VERSION-windows-amd64.msi")"
          check_sidecar "$f"; cp -- "$f" dist/
          zip="$(one windows-zip '*.zip')"
          check_sidecar "$zip"; cp -- "$zip" dist/

          # 安装包的 SBOM：解开实际发布的文件再扫描（MSI 暂不在 Linux 上解包，不单独出 SBOM）
          sbom_of() {
            local file="$1" base tmp
            base="${file%.tar.gz}"; base="${base%.zip}"
            tmp="$(mktemp -d)"
            case "$file" in
              *.tar.gz) tar -xzf "dist/$file" -C "$tmp" ;;
              *.zip) unzip -q "dist/$file" -d "$tmp" ;;
            esac
            "$SYFT" "dir:$tmp" --source-name "$base" --source-version "$VERSION" -o "spdx-json=dist/$base.spdx.json"
            rm -rf "$tmp"
          }
          sbom_of "yunshu-$VERSION-linux-amd64.tar.gz"
          sbom_of "yunshu-$VERSION-linux-arm64.tar.gz"
          sbom_of "$(basename "$zip")"

          (cd dist && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS && sha256sum -c SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Install cosign
        # v4.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v3.0.6'

      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS

      - name: Build provenance attestation for every release file
        # v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload release files
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Draft GitHub Release
    needs: [version, publish-image, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      DIGEST: ${{ needs.publish-image.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout Repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: .github/release-notes

      - name: Download release files
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-dist
          path: dist

      - name: Create draft release
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          notes="$RUNNER_TEMP/notes.md"
          cat ".github/release-notes/$TAG.md" > "$notes"
          {
            echo
            echo "---"
            echo
            echo "**镜像 / Image**"
            echo
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$notes"

          flags=(--draft --verify-tag --title "云枢 Yunshu $VERSION" --notes-file "$notes")
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi

          if existing="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            # 重跑：只允许更新还是草稿的发布；已发布的不动（不能移动已发布的标签和附件）
            if [[ "$existing" != true ]]; then
              echo "::error::$TAG 的发布已经公开，不再修改；请改发下一个版本号"
              exit 1
            fi
            gh release edit "$TAG" --notes-file "$notes"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
          {
            echo "### Draft release"
            echo
            gh release view "$TAG" --json url --jq .url
            echo
            echo "检查附件和说明后在 GitHub 上手动发布；首次发布前先把 GHCR 包改为公开。"
          } >> "$GITHUB_STEP_SUMMARY"
